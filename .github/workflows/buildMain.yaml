name: BuildMainAndTest

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        run: mvn clean install

      - name: Run Tests
        run: mvn test

      - name: Build Jib image
        run: mvn -B -DskipTests jib:dockerBuild